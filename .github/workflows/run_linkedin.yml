name: Run LinkedIn RSS Poster

on:
  schedule:
    - cron: "0 * * * *"     # every hour at :00
  workflow_dispatch:       # manual trigger

permissions:
  contents: write          # required to commit back to repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome (for Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libxi6 libgconf-2-4
          # Install latest chrome
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "LINKEDIN_EMAIL=${{ secrets.LINKEDIN_EMAIL }}" >> .env
          echo "LINKEDIN_PASSWORD=${{ secrets.LINKEDIN_PASSWORD }}" >> .env
          echo "GENEMINIAPIKEY=${{ secrets.GENEMINIAPIKEY }}" >> .env

      - name: Run the LinkedIn poster
        env:
          DOTENV_PATH: .env
          DISPLAY: ":99"
        run: |
          python main.py

      - name: Commit last_blog_title.txt if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ensure file exists and is tracked
          if [ -f last_blog_title.txt ]; then
            git add last_blog_title.txt || true
            git diff --staged --quiet || ( git commit -m "chore: update last_blog_title.txt" && git push )
          else
            echo "no last_blog_title.txt found"
          fi
